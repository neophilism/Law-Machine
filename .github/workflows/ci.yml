name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate foundation, boundaries, types, lint, tests and source security
        run: pnpm check
      - name: Build the public app
        run: pnpm build
      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Test desktop and mobile browser journeys
        run: pnpm test:browser
      - name: Audit locked dependencies
        run: pnpm scan:dependencies
